[project]
name = "fedm"
version = "2.2.0"
description = "Честный бенчмарк DNS-резолверов: plain, DoT, DoH, DoQ"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "K1egaL", url = "https://github.com/K1egaL" },
]
keywords = [
    "dns", "benchmark", "doh", "dot", "doq", "quic",
    "resolver", "latency", "linux", "pyside6", "qt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PySide6>=6.10",
    "dnspython>=2.8",
    "httpx>=0.27",
    "aioquic>=1.3",
    "icmplib>=3.0",
]

[project.urls]
Homepage = "https://github.com/K1egaL/fedm"
Repository = "https://github.com/K1egaL/fedm"
Issues = "https://github.com/K1egaL/fedm/issues"
Changelog = "https://github.com/K1egaL/fedm/commits/main"

[project.scripts]
fedm = "fedm.ui:main"