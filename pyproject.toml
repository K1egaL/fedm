[project]
name = "fedm"
version = "2.2.0"
description = "Fast DNS benchmarker — plain / DoT / DoH / DoQ"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "K1egaL" },
]
keywords = ["dns", "benchmark", "doh", "dot", "doq", "linux", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
]
dependencies = [
    "PySide6>=6.10",
    "dnspython>=2.8",
    "httpx>=0.27",
    "aioquic>=1.3",
    "icmplib>=3.0",
]

[project.urls]
Homepage = "https://github.com/K1egaL/fedm"
Repository = "https://github.com/K1egaL/fedm"
Issues = "https://github.com/K1egaL/fedm/issues"

[project.scripts]
fedm = "fedm.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fedm"]